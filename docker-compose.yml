name: asandesk-dashboard

# تنها مقادیر لازم در .env: POSTGRES_USER و POSTGRES_PASSWORD
# بقیه تنظیمات پیش‌فرض دارند و در صورت نیاز می‌توان آن‌ها را هم در .env بازنویسی کرد (README).

# پروکسی اختیاری برای دانلود پکیج‌ها هنگام بیلد (npm/pip). مثال: BUILD_PROXY=http://127.0.0.1:10809
x-build-proxy: &build-proxy
  HTTP_PROXY: ${BUILD_PROXY:-}
  HTTPS_PROXY: ${BUILD_PROXY:-}
  http_proxy: ${BUILD_PROXY:-}
  https_proxy: ${BUILD_PROXY:-}
  NO_PROXY: localhost,127.0.0.1
  no_proxy: localhost,127.0.0.1

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-asandesk}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      # شبکه میزبان فقط هنگام بیلد، تا پروکسی روی 127.0.0.1 سرور در دسترس باشد
      network: host
      args: *build-proxy
    restart: unless-stopped
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      TZ: ${TZ:-Asia/Tehran}
      DJANGO_DEBUG: "0"
      USE_X_ACCEL_REDIRECT: "1"
      # اختیاری: آدرس عمومی برای لینک‌های latest.json (خالی = همان آدرسی که پنل با آن باز می‌شود)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      RELEASE_MAX_FILE_MB: ${RELEASE_MAX_FILE_MB:-500}
      LOCAL_SERVER_NAME: ${LOCAL_SERVER_NAME:-dashboard-local}
      LOCAL_SERVER_REGION: ${LOCAL_SERVER_REGION:-محلی}
      # آدرس مخفی پنل؛ backend فقط برای فایل «اطلاعات ورود» کاربر تازه به آن نیاز دارد
      PANEL_KEY: ${PANEL_KEY:-}
    volumes:
      - releases:/data/releases
      - static:/data/static
      - secrets:/data/secrets
      - agent-token:/data/agent
      - backups:/data/backups
      # توکن سرویس control (فقط خواندنی): با آن به‌روزرسانی پنل و لاگ داکر فراخوانی می‌شود
      - control-token:/data/control:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/auth/csrf').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # پشتیبان‌گیری خودکار، صف بازگردانی و بررسی سلامت سرورهای HA (همان ایمیج backend)
  scheduler:
    build:
      context: ./backend
      network: host
      args: *build-proxy
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "run_scheduler"]
    command: []
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      TZ: ${TZ:-Asia/Tehran}
      DJANGO_DEBUG: "0"
    volumes:
      - releases:/data/releases
      - secrets:/data/secrets
      - backups:/data/backups
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # شبکه میزبان فقط هنگام بیلد، تا پروکسی روی 127.0.0.1 سرور در دسترس باشد
      network: host
      args: *build-proxy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tehran}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # entrypoint.sh از PANEL_KEY فایل آدرس مخفی را می‌نویسد و بعد nginx را اجرا می‌کند (README: «آدرس مخفی پنل»)
    entrypoint: ["/bin/sh", "/gate/entrypoint.sh"]
    environment:
      PANEL_KEY: ${PANEL_KEY:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/gate:/gate:ro
      # صفحه‌های خطای برندشده (scripts/gen-error-pages.py)
      - ./nginx/errors:/usr/share/nginx/errors:ro
      - releases:/data/releases:ro
      - static:/data/static:ro
    depends_on:
      - backend
      - frontend

  # منابع همین سرور (میزبان داکر) را به داشبورد گزارش می‌دهد
  agent:
    build:
      context: ./agent
      # شبکه میزبان فقط هنگام بیلد، تا پروکسی روی 127.0.0.1 سرور در دسترس باشد
      network: host
      args: *build-proxy
    restart: unless-stopped
    pid: host
    environment:
      AGENT_URL: http://backend:8000/api/agent/ingest
      AGENT_TOKEN_FILE: /run/agent/token
      AGENT_DISK_PATH: /hostfs
      AGENT_SYS: /hostsys
      AGENT_PORTS: ${AGENT_PORTS:-}
      AGENT_NET_CAPACITY_MBPS: ${AGENT_NET_CAPACITY_MBPS:-}
      AGENT_IP: ${AGENT_IP:-}
    volumes:
      - agent-token:/run/agent:ro
      - /:/hostfs:ro
      - /sys:/hostsys:ro
    depends_on:
      backend:
        condition: service_healthy

  # تنها بخشی که با داکر حرف می‌زند: لاگ کانتینرها و «به‌روزرسانی پنل» از داخل تنظیمات.
  # روی هیچ پورتی منتشر نمی‌شود؛ فقط backend، با توکنی که در volume مشترک است، می‌تواند صدایش کند.
  # دسترسی به docker.sock یعنی دسترسی root به میزبان، برای همین کدش کوچک و جداست (control/control.py).
  control:
    build:
      context: ./control
      # شبکه میزبان فقط هنگام بیلد، تا پروکسی روی 127.0.0.1 سرور در دسترس باشد
      network: host
      args: *build-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Tehran}
      # پروکسی HTTP برای git (گرفتن نسخهٔ جدید از GitHub)؛ پیش‌فرض همان BUILD_PROXY
      GIT_PROXY: ${GIT_PROXY:-}
      BUILD_PROXY: ${BUILD_PROXY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control-token:/run/control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  releases:
  static:
  secrets:
  agent-token:
  backups:
  control-token:
