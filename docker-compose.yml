name: asandesk-dashboard

# تنها مقادیر لازم در .env: POSTGRES_USER و POSTGRES_PASSWORD
# بقیه تنظیمات پیش‌فرض دارند و در صورت نیاز می‌توان آن‌ها را هم در .env بازنویسی کرد (README).

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-asandesk}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      TZ: ${TZ:-Asia/Tehran}
      DJANGO_DEBUG: "0"
      USE_X_ACCEL_REDIRECT: "1"
      # اختیاری: آدرس عمومی برای لینک‌های latest.json (خالی = همان آدرسی که پنل با آن باز می‌شود)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      RELEASE_MAX_FILE_MB: ${RELEASE_MAX_FILE_MB:-500}
      LOCAL_SERVER_NAME: ${LOCAL_SERVER_NAME:-dashboard-local}
      LOCAL_SERVER_REGION: ${LOCAL_SERVER_REGION:-محلی}
    volumes:
      - releases:/data/releases
      - static:/data/static
      - secrets:/data/secrets
      - agent-token:/data/agent
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/auth/csrf').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tehran}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - releases:/data/releases:ro
      - static:/data/static:ro
    depends_on:
      - backend
      - frontend

  # منابع همین سرور (میزبان داکر) را به داشبورد گزارش می‌دهد
  agent:
    build: ./agent
    restart: unless-stopped
    pid: host
    environment:
      AGENT_URL: http://backend:8000/api/agent/ingest
      AGENT_TOKEN_FILE: /run/agent/token
      AGENT_DISK_PATH: /hostfs
      AGENT_SYS: /hostsys
      AGENT_PORTS: ${AGENT_PORTS:-}
      AGENT_NET_CAPACITY_MBPS: ${AGENT_NET_CAPACITY_MBPS:-}
      AGENT_IP: ${AGENT_IP:-}
    volumes:
      - agent-token:/run/agent:ro
      - /:/hostfs:ro
      - /sys:/hostsys:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  releases:
  static:
  secrets:
  agent-token:
