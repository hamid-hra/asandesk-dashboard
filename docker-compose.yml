name: asandesk-dashboard

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
  TZ: ${TZ:-Asia/Tehran}
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:-asandesk}
  POSTGRES_USER: ${POSTGRES_USER:-asandesk}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  OWNER_USERNAME: ${OWNER_USERNAME:-}
  OWNER_PASSWORD: ${OWNER_PASSWORD:-}
  AGENT_TOKEN: ${AGENT_TOKEN:-}
  LOCAL_SERVER_NAME: ${LOCAL_SERVER_NAME:-dashboard-local}
  LOCAL_SERVER_REGION: ${LOCAL_SERVER_REGION:-محلی}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  RELEASE_MAX_FILE_MB: ${RELEASE_MAX_FILE_MB:-500}
  USE_X_ACCEL_REDIRECT: "1"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asandesk}
      POSTGRES_USER: ${POSTGRES_USER:-asandesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - releases:/data/releases
      - static:/data/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/auth/csrf').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tehran}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - releases:/data/releases:ro
      - static:/data/static:ro
    depends_on:
      - backend
      - frontend

  # منابع همین سرور (میزبان داکر) را به داشبورد گزارش می‌دهد
  agent:
    build: ./agent
    restart: unless-stopped
    pid: host
    environment:
      AGENT_URL: http://backend:8000/api/agent/ingest
      AGENT_TOKEN: ${AGENT_TOKEN:?set AGENT_TOKEN in .env}
      AGENT_DISK_PATH: /hostfs
      AGENT_SYS: /hostsys
      AGENT_PORTS: ${AGENT_PORTS:-}
      AGENT_NET_CAPACITY_MBPS: ${AGENT_NET_CAPACITY_MBPS:-}
      AGENT_IP: ${AGENT_IP:-}
    volumes:
      - /:/hostfs:ro
      - /sys:/hostsys:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  releases:
  static:
