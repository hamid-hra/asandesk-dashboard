name: asandesk-dashboard

# تنها مقادیر لازم در .env: POSTGRES_USER و POSTGRES_PASSWORD
# بقیه تنظیمات پیش‌فرض دارند و در صورت نیاز می‌توان آن‌ها را هم در .env بازنویسی کرد (README).

# پروکسی اختیاری برای دانلود پکیج‌ها هنگام بیلد (npm/pip). مثال: BUILD_PROXY=http://127.0.0.1:10809
x-build-proxy: &build-proxy
  HTTP_PROXY: ${BUILD_PROXY:-}
  HTTPS_PROXY: ${BUILD_PROXY:-}
  http_proxy: ${BUILD_PROXY:-}
  https_proxy: ${BUILD_PROXY:-}
  NO_PROXY: localhost,127.0.0.1
  no_proxy: localhost,127.0.0.1

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-asandesk}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      # شبکه میزبان فقط هنگام بیلد، تا پروکسی روی 127.0.0.1 سرور در دسترس باشد
      network: host
      args: *build-proxy
    restart: unless-stopped
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      TZ: ${TZ:-Asia/Tehran}
      DJANGO_DEBUG: "0"
      USE_X_ACCEL_REDIRECT: "1"
      # اختیاری: آدرس عمومی برای لینک‌های latest.json (خالی = همان آدرسی که پنل با آن باز می‌شود)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      RELEASE_MAX_FILE_MB: ${RELEASE_MAX_FILE_MB:-500}
      # ظرفیت وب‌سرور و سقف سوءاستفاده (README: «محدودیت‌ها و حفاظت در برابر سوءاستفاده»)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      CLIENT_NEW_DEVICES_PER_IP_HOUR: ${CLIENT_NEW_DEVICES_PER_IP_HOUR:-100}
      CLIENT_FEEDBACK_PER_IP_HOUR: ${CLIENT_FEEDBACK_PER_IP_HOUR:-30}
      FEEDBACK_MAX_TOTAL_MB: ${FEEDBACK_MAX_TOTAL_MB:-2048}
      LOCAL_SERVER_NAME: ${LOCAL_SERVER_NAME:-dashboard-local}
      LOCAL_SERVER_REGION: ${LOCAL_SERVER_REGION:-محلی}
      # آدرس مخفی پنل؛ backend فقط برای فایل «اطلاعات ورود» کاربر تازه به آن نیاز دارد
      PANEL_KEY: ${PANEL_KEY:-}
      # آسان دسک وب (README: «آسان دسک وب»)
      WEB_RENDEZVOUS_HOST: ${WEB_RENDEZVOUS_HOST:-rd.asandesk.ir}
      WEB_RS_PUBLIC_KEY: ${WEB_RS_PUBLIC_KEY:-joRoqzc0SDOHe61V9WrRORk4PqBVzBntfGtzveM3h8M=}
      WEB_RELAY_WS_MAP: ${WEB_RELAY_WS_MAP:-}
      WEB_DOWNLOAD_URL: ${WEB_DOWNLOAD_URL:-https://asandesk.ir/download}
    volumes:
      - releases:/data/releases
      - static:/data/static
      - secrets:/data/secrets
      - backups:/data/backups
      # توکن سرویس control (فقط خواندنی): با آن به‌روزرسانی پنل و لاگ داکر فراخوانی می‌شود
      - control-token:/data/control:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/auth/csrf').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # پشتیبان‌گیری خودکار، صف بازگردانی و بررسی سلامت سرورهای HA (همان ایمیج backend)
  scheduler:
    build:
      context: ./backend
      network: host
      args: *build-proxy
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "run_scheduler"]
    command: []
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      TZ: ${TZ:-Asia/Tehran}
      DJANGO_DEBUG: "0"
    volumes:
      - releases:/data/releases
      - secrets:/data/secrets
      - backups:/data/backups
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # شبکه میزبان فقط هنگام بیلد، تا پروکسی روی 127.0.0.1 سرور در دسترس باشد
      network: host
      args: *build-proxy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tehran}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # entrypoint.sh از PANEL_KEY فایل آدرس مخفی را می‌نویسد و بعد nginx را اجرا می‌کند (README: «آدرس مخفی پنل»)
    entrypoint: ["/bin/sh", "/gate/entrypoint.sh"]
    environment:
      PANEL_KEY: ${PANEL_KEY:-}
      # آسان دسک وب: نشانی داخلی سرور شناسه و رله‌ها (nginx/gate/web-hbbs.sh، docs/ASANDESK-WEB.md)
      HBBS_LAN_IP: ${HBBS_LAN_IP:-}
      HBBR_LAN_IP: ${HBBR_LAN_IP:-}
      WEB_RELAY_LAN: ${WEB_RELAY_LAN:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # شبکه‌های CDN برای خواندن آدرس واقعی بازدیدکننده (scripts/update-cdn-ips.sh)
      - ./nginx/cdn-ips.conf:/etc/nginx/cdn-ips.conf:ro
      - ./nginx/gate:/gate:ro
      # صفحه‌های خطای برندشده (scripts/gen-error-pages.py)
      - ./nginx/errors:/usr/share/nginx/errors:ro
      - releases:/data/releases:ro
      - static:/data/static:ro
    depends_on:
      - backend
      - frontend

  # آسان دسک وب: فایل‌های برنامهٔ وب (web.asandesk.ir). nginx اصلی درخواست‌ها را به این‌جا می‌فرستد.
  web:
    build:
      context: ./web
      network: host
      args: *build-proxy
    restart: unless-stopped

  # درگاه آسان دسک وب: کد کاربر وب را تا وقتی صفحه باز است در hbbs ثبت می‌کند (فقط مسیر /ws/gw از nginx)
  webgw:
    build:
      context: ./webgw
      network: host
      args: *build-proxy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tehran}
      BACKEND_URL: http://backend:8000
      # سرور شناسه (UDP و TCP روی 21116): پیش‌فرض rd.asandesk.ir، همان نامی که برنامهٔ دسکتاپ به آن وصل می‌شود، تا
      # کد کاربر وب در همان hbbs ثبت شود که کارشناس از آن می‌پرسد. اگر hbbs در همین شبکهٔ داخلی است و نام عمومی از
      # داخل نمی‌رسد: HBBS_LAN_IP=<نشانی داخلی hbbs> (nginx هم همان را می‌خواند). WEBGW_HBBS_HOST بر هر دو مقدم است؛
      # WEBGW_HBBS_HOST=hbbs-host یعنی خود همین میزبان (یا HBBS_IP).
      HBBS_HOST: ${WEBGW_HBBS_HOST:-}
      HBBS_LAN_IP: ${HBBS_LAN_IP:-}
      HBBS_PORT: ${WEBGW_HBBS_PORT:-21116}
      # رله‌ای که به کنترل‌کننده‌ها معرفی می‌شود؛ باید همان رله‌ای باشد که /ws/relay در nginx به آن می‌رسد
      RELAY_SERVER: ${WEBGW_RELAY_SERVER:-rd.asandesk.ir}
      MAX_ONLINE: ${WEBGW_MAX_ONLINE:-5000}
    extra_hosts:
      - "hbbs-host:${HBBS_IP:-host-gateway}"
    depends_on:
      backend:
        condition: service_healthy

  # تنها بخشی که با داکر حرف می‌زند: لاگ کانتینرها و «به‌روزرسانی پنل» از داخل تنظیمات.
  # روی هیچ پورتی منتشر نمی‌شود؛ فقط backend، با توکنی که در volume مشترک است، می‌تواند صدایش کند.
  # دسترسی به docker.sock یعنی دسترسی root به میزبان، برای همین کدش کوچک و جداست (control/control.py).
  control:
    build:
      context: ./control
      # شبکه میزبان فقط هنگام بیلد، تا پروکسی روی 127.0.0.1 سرور در دسترس باشد
      network: host
      args: *build-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Tehran}
      # پروکسی HTTP برای git (گرفتن نسخهٔ جدید از GitHub)؛ پیش‌فرض همان BUILD_PROXY
      GIT_PROXY: ${GIT_PROXY:-}
      BUILD_PROXY: ${BUILD_PROXY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control-token:/run/control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  releases:
  static:
  secrets:
  backups:
  control-token:
