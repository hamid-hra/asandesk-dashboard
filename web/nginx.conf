server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # فایل اصلی برنامه بی‌فشرده‌سازی حدود ۴۴۰ کیلوبایت است و با gzip حدود ۱۳۵. nginx اصلی با HTTP/1.0 پراکسی
    # می‌کند و gzip به‌طور پیش‌فرض فقط به 1.1 جواب فشرده می‌دهد.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # فایل‌های بیلد نام هش‌دار دارند و هرگز عوض نمی‌شوند
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # service worker و manifest همیشه تازه (به‌روزرسانی برنامهٔ نصب‌شده)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
