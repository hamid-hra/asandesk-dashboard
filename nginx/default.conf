upstream backend { server backend:8000; }
upstream frontend { server frontend:3000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 600m;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_request_buffering off;
        proxy_pass http://backend;
    }

    location /admin/ {
        proxy_pass http://backend;
    }

    location /static/ {
        alias /data/static/;
        expires 7d;
    }

    # فایل نسخه برای به‌روزرسانی خودکار کلاینت (ORG_UPDATE_URL)
    location ~ ^/releases/(latest|latest-beta)\.json$ {
        root /data;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # فایل‌های نصب فقط از طریق /api/releases/<version>/download/<platform> (برای شمارش دانلود)
    location /_protected/releases/ {
        internal;
        alias /data/releases/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://frontend;
    }
}
