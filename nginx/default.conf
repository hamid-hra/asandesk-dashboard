upstream backend { server backend:8000; }
upstream frontend { server frontend:3000; }

# آدرس واقعی بازدیدکننده پشت CDN: بدون این، $remote_addr همیشه آدرس خود CDN است و هر محدودیتِ به‌ازای IP
# (این‌جا و در Django) همهٔ کاربران را یک نفر می‌بیند. فایل cdn-ips.conf شبکه‌های CDN را فهرست می‌کند
# (scripts/update-cdn-ips.sh)؛ علامت * یعنی اگر فایل نبود خطا نده.
include /etc/nginx/cdn-ips*.conf;

# محدودیت نرخ به‌ازای هر آدرس. دستگاه‌ها هر ۱۵ ثانیه (در اتصال هر ۳ ثانیه) heartbeat می‌فرستند و پشت یک NAT
# ممکن است صدها دستگاه یک IP داشته باشند؛ پس سقف دستگاه سخاوتمند است و سقف بازخورد و ورود سخت‌گیر.
limit_req_zone $binary_remote_addr zone=asan_device:20m rate=60r/s;
limit_req_zone $binary_remote_addr zone=asan_feedback:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=asan_login:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=asan_updates:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=asan_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# اگر پروکسی/TLS دیگری جلوی nginx باشد، پروتکل اصلی را حفظ می‌کنیم (برای بررسی CSRF در Django)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# HSTS فقط وقتی کاربر با https آمده (TLS پای CDN تمام می‌شود)
map $forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# شناسهٔ پیگیری صفحهٔ خطا: ۸ نویسهٔ اول $request_id. همین مقدار (کامل) در لاگ دسترسی
# با rid= هست، پس با شناسه‌ای که کاربر می‌فرستد درخواستش پیدا می‌شود.
map $request_id $err_ref {
    "~^(?<a>[0-9a-f]{4})(?<b>[0-9a-f]{4})" "AD-$a-$b";
    default "AD-0000-0000";
}

log_format asan '$remote_addr [$time_local] "$request" $status $body_bytes_sent rid=$request_id';

# تنظیمات مشترک پروکسی (در هر دو سرور استفاده می‌شود)
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;

# ---------------------------------------------------------------------------
# سرور «کلاینت‌ها»: api.asandesk.ir
# کلاینت‌های عمومی فقط با این نام حرف می‌زنند و فقط به مسیرهای گزارش و آپدیت
# دسترسی دارند. هر مسیر دیگر (پنل، /admin، API داده‌ها) ۴۰۴ می‌گیرد، پس کاربر
# هیچ راهی به پنل مالک ندارد.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.asandesk.ir;

    client_max_body_size 8m;
    # حداکثر اتصال هم‌زمان از یک آدرس
    limit_conn asan_conn 60;

    # این سرور فقط JSON و متن ساده می‌دهد: هیچ چیزی نباید در مرورگر اجرا یا جاسازی شود
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security $hsts always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    server_tokens off;
    access_log /var/log/nginx/access.log asan;

    # صفحه‌های خطای برندشده (استاتیک؛ با خرابی backend هم نمایش داده می‌شوند).
    # فقط خطاهای خود nginx (مثل ۴۰۴ مسیرهای غیرمجاز) این صفحه را می‌گیرند؛ پاسخ خطای
    # backend (JSON) بدون تغییر به کلاینت می‌رسد. ساخت: scripts/gen-error-pages.py
    error_page 404 /__errors/404.html;
    error_page 403 /__errors/403.html;
    error_page 500 /__errors/500.html;
    error_page 502 503 504 /__errors/503.html;
    location ^~ /__errors/fonts/ {
        alias /usr/share/nginx/errors/fonts/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /__errors/ {
        internal;
        alias /usr/share/nginx/errors/api/;
        default_type text/html;
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '__REF__' $err_ref;
        add_header Cache-Control "no-store" always;
    }

    # گزارش دستگاه/اتصال (سازگار با API سرور RustDesk؛ backend/clients/client_api.py)
    location = /api/heartbeat   { limit_req zone=asan_device burst=100 nodelay; client_max_body_size 64k; proxy_pass http://backend; }
    location = /api/sysinfo     { limit_req zone=asan_device burst=100 nodelay; client_max_body_size 64k; proxy_pass http://backend; }
    location = /api/sysinfo_ver { limit_req zone=asan_device burst=100 nodelay; client_max_body_size 64k; proxy_pass http://backend; }
    location ~ ^/api/audit/[a-z]+$ { limit_req zone=asan_device burst=100 nodelay; client_max_body_size 64k; proxy_pass http://backend; }

    # حساب کاربری داخل اپ
    location = /api/login         { limit_req zone=asan_login burst=5 nodelay; client_max_body_size 16k; proxy_pass http://backend; }
    location = /api/logout        { limit_req zone=asan_device burst=50 nodelay; client_max_body_size 16k; proxy_pass http://backend; }
    location = /api/currentUser   { limit_req zone=asan_device burst=50 nodelay; client_max_body_size 16k; proxy_pass http://backend; }
    location = /api/login-options { limit_req zone=asan_device burst=50 nodelay; proxy_pass http://backend; }

    # «ارسال بازخورد» از داخل اپ: متن + لاگ فشرده + تا ۳ تصویر (تا ۸ مگابایت؛ client_max_body_size همین سرور).
    # سقف: ۶ در دقیقه برای هر آدرس؛ Django هم سقف ساعتی و سقف کل فضا را دارد.
    location = /api/client/feedback { limit_req zone=asan_feedback burst=4 nodelay; proxy_pass http://backend; }

    # فهرست نسخه‌ها و دانلود فایل نصب (برای آپدیت خودکار)
    location = /api/releases { limit_req zone=asan_updates burst=20 nodelay; proxy_pass http://backend; }
    location ~ ^/api/releases/[^/]+/download/ { limit_req zone=asan_updates burst=20 nodelay; limit_conn asan_conn 10; proxy_pass http://backend; }

    # فایل نسخه برای آپدیت خودکار کلاینت (latest.json)
    location ~ ^/releases/(latest|latest-beta)\.json$ {
        root /data;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # ارسال فایل نصب با X-Accel-Redirect (شمارش دانلود)
    location /_protected/releases/ {
        internal;
        alias /data/releases/;
    }

    # هر چیز دیگر برای کلاینت‌ها وجود ندارد
    location / { return 404; }
}

# ---------------------------------------------------------------------------
# سرور «پنل مالک»: panel.asandesk.ir (و دسترسی مستقیم با IP سرور)
# کل پنل و /admin اینجاست. برای امنیت بیشتر، دسترسی را به IPهای تیم محدود کنید:
# بلاک allow/deny زیر را از حالت کامنت دربیاورید و IP خود را بگذارید.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name panel.asandesk.ir _;

    # آدرس مخفی پنل: با PANEL_KEY در .env روشن می‌شود و nginx/gate/entrypoint.sh این فایل را می‌نویسد.
    # بدون کوکی مخصوص، همهٔ مسیرهای پنل (حتی با IP مستقیم) ۴۰۴ می‌دهند. خالی بودن PANEL_KEY = بدون محدودیت.
    # (علامت * یعنی اگر فایل وجود نداشت خطا نده)
    include /etc/nginx/panel-gate*.conf;

    client_max_body_size 600m;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    limit_conn asan_conn 100;

    # سرآیندهای امنیتی (یک منبع: nginx؛ نسخهٔ Django حذف می‌شود تا دوبار نیاید).
    # CSP: Next.js برای بارگذاری صفحه به اسکریپت و استایل inline نیاز دارد؛ فونت‌ها و همهٔ فایل‌ها از خود سایت می‌آیند.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security $hsts always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    server_tokens off;
    access_log /var/log/nginx/access.log asan;

    # صفحه‌های خطای برندشده برای خطاهای خود nginx (مثلاً وقتی frontend یا backend بالا نیست).
    # ۴۰۴ صفحه‌های پنل را خود Next.js می‌دهد. ساخت: scripts/gen-error-pages.py
    error_page 403 /__errors/403.html;
    error_page 500 /__errors/500.html;
    error_page 502 503 504 /__errors/503.html;
    location ^~ /__errors/fonts/ {
        alias /usr/share/nginx/errors/fonts/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /__errors/ {
        internal;
        alias /usr/share/nginx/errors/panel/;
        default_type text/html;
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '__REF__' $err_ref;
        add_header Cache-Control "no-store" always;
    }

    # --- محدودیت IP (اختیاری ولی توصیه‌شده) ---
    # allow 203.0.113.10;     # IP دفتر/تیم شما
    # allow 127.0.0.1;
    # deny all;

    # ورود، بازیابی رمز و راه‌اندازی: بدنهٔ کوچک و محدودیت نرخ (Django هم محدودیت خودش را دارد)
    location ~ ^/api/auth/(login|recovery|setup|password) {
        limit_req zone=asan_login burst=6 nodelay;
        client_max_body_size 16k;
        proxy_pass http://backend;
    }

    # بارگذاری فایل پشتیبان (.adbk) تا ۴ گیگابایت
    location = /api/settings/backups/upload {
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_pass http://backend;
    }

    location /api/ {
        proxy_request_buffering off;
        proxy_pass http://backend;
    }

    location /admin/ {
        proxy_pass http://backend;
    }

    location /static/ {
        alias /data/static/;
        expires 7d;
    }

    location ~ ^/releases/(latest|latest-beta)\.json$ {
        root /data;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location /_protected/releases/ {
        internal;
        alias /data/releases/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://frontend;
    }
}
